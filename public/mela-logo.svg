<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Blue Nile / Tana Gradient -->
    <linearGradient id="nileBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" /> <!-- Bright Tana Blue -->
      <stop offset="100%" stop-color="#1e3a8a" /> <!-- Deep Royal Navy -->
    </linearGradient>
    
    <!-- Bahir Dar Golden Sun Gradient -->
    <linearGradient id="bduGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow for the Bridge/M -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- 1. The Water Drop / Support Shield -->
  <path d="M256 32 C256 32 96 224 96 352 C96 440.3 167.6 512 256 512 C344.4 512 416 440.3 416 352 C416 224 256 32 256 32 Z" 
        fill="url(#nileBlue)"/>

  <!-- Subtle Water Waves at the base of the Nile -->
  <path d="M128 450 Q 192 420, 256 450 T 384 450" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M160 480 Q 208 460, 256 480 T 352 480" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- 2. The Sun-Gear (Technology meets Nature) -->
  <!-- Inner Sun -->
  <circle cx="256" cy="220" r="48" fill="url(#bduGold)"/>
  <!-- Outer Gear Teeth -->
  <circle cx="256" cy="220" r="58" fill="none" stroke="url(#bduGold)" stroke-width="6" stroke-dasharray="12 12" />

  <!-- 3. The Digital Network Circuit (Connecting the nodes) -->
  <path d="M156 280 L256 220 L356 280" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="6 4" fill="none"/>

  <!-- 4. The "M" / Abay Bridge / BiT Structure -->
  <!-- This precise polygon forms a heavy, structural 'M' -->
  <path d="M136 400 L136 280 L176 280 L256 344 L336 280 L376 280 L376 400 L320 400 L320 336 L256 384 L192 336 L192 400 Z" 
        fill="#ffffff" filter="url(#shadow)"/>

  <!-- 5. Tech Nodes (The system dispatchers) -->
  <!-- Left Pillar Node -->
  <circle cx="156" cy="280" r="10" fill="#0284c7"/>
  <circle cx="156" cy="280" r="4" fill="#ffffff"/>
  
  <!-- Right Pillar Node -->
  <circle cx="356" cy="280" r="10" fill="#0284c7"/>
  <circle cx="356" cy="280" r="4" fill="#ffffff"/>
  
  <!-- Center Heart Node (The Solution / Mela) -->
  <circle cx="256" cy="344" r="12" fill="url(#bduGold)"/>
  <circle cx="256" cy="344" r="5" fill="#ffffff"/>

</svg>